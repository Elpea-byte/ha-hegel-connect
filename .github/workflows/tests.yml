name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check"
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements_test.txt
      - run: pytest -q --cov=custom_components.hegel_connect --cov-report=term-missing
      # Quality scale rule config-flow-test-coverage: the config flow is fully tested
      - run: coverage report --include="custom_components/hegel_connect/config_flow.py" --fail-under=100

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements_test.txt
      - run: mypy custom_components/hegel_connect
