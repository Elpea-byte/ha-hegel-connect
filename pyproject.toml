[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# Home Assistant re-exports names from its packages without __all__
module = "homeassistant.*"
implicit_reexport = true

[tool.coverage.run]
branch = true

[tool.coverage.report]
# Floor at today's level so coverage cannot drop; raised step by step towards 95%.
fail_under = 73

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "SIM", "RUF", "ASYNC"]
# ASYNC109: the timeout parameters of the client are intentional (per-request timeouts)
ignore = ["ASYNC109"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.hegel_connect"]
force-sort-within-sections = true
combine-as-imports = true
