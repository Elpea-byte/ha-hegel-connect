blueprint:
  name: Hegel Connect – announcement, then back to what played
  description: >-
    A script that speaks a message on the amplifier and then puts it back as it
    was: power, input, volume and mute come back, and what played before starts
    again (internet radio from the start, Spotify where it was). The message goes
    through the amplifier's Cast entity and a text-to-speech entity of your own.
    The Cast entity is often disabled: enable it under the amplifier's device and
    restart Home Assistant (reloading the Cast integration was not enough in a
    test). It waits until the message has played instead of a fixed pause. Run it
    with `message` from an automation, a button or a voice command.
  domain: script
  homeassistant:
    min_version: 2025.4.0
  source_url: https://github.com/Elpea-byte/ha-hegel-connect/blob/main/blueprints/script/hegel_connect/announcement.yaml
  input:
    amplifier:
      name: Amplifier
      selector:
        entity:
          filter:
            integration: hegel_connect
            domain: media_player
    cast_player:
      name: Cast entity of the amplifier
      description: The amplifier as a Google Cast media player (from the Cast integration).
      selector:
        entity:
          filter:
            integration: cast
            domain: media_player
    tts_engine:
      name: Text-to-speech
      selector:
        entity:
          filter:
            domain: tts
    language:
      name: Language
      description: >-
        Language of the message for the text-to-speech, for example "nl" or
        "en-GB". Leave empty for its own default (often English).
      default: ""
      selector:
        text:
    volume:
      name: Volume of the message
      description: >-
        Volume for the message (0–100); 0 leaves the volume alone. The maximum
        volume still applies, and the volume from before comes back afterwards.
      default: 0
      selector:
        number:
          min: 0
          max: 100
          step: 1
    max_seconds:
      name: Longest message
      description: Put the amplifier back after this many seconds at the latest.
      default: 60
      selector:
        number:
          min: 5
          max: 600
          step: 5
          unit_of_measurement: s

fields:
  message:
    name: Message
    description: The text to speak.
    required: true
    example: Dinner is ready
    selector:
      text:

mode: queued

variables:
  amplifier: !input amplifier
  cast_player: !input cast_player
  volume: !input volume
  max_seconds: !input max_seconds
  language: !input language
  # Playing before the message: start it again afterwards (the scene brings back power, input and volume,
  # not what played).
  was_playing: "{{ states(amplifier) in ['playing', 'buffering'] }}"

sequence:
  - action: scene.create
    data:
      scene_id: hegel_connect_before_announcement
      snapshot_entities:
        - !input amplifier
  - if:
      - condition: template
        value_template: "{{ (volume | int(0)) > 0 }}"
    then:
      - if:
          - condition: template
            value_template: "{{ is_state(amplifier, 'off') }}"
        then:
          - action: media_player.turn_on
            target:
              entity_id: !input amplifier
          - wait_template: "{{ not is_state(amplifier, 'off') }}"
            timeout: {seconds: 15}
      - action: media_player.volume_set
        continue_on_error: true  # an input with fixed volume keeps its volume
        target:
          entity_id: !input amplifier
        data:
          volume_level: "{{ (volume | int(0)) / 100 }}"
  - action: tts.speak
    target:
      entity_id: !input tts_engine
    data: >-
      {% set data = {'media_player_entity_id': cast_player, 'message': message} %}
      {{ dict(data, language=language | trim) if language | trim else data }}
  # Wait for the message to start, then for it to end (instead of a fixed pause).
  - wait_template: "{{ is_state(cast_player, 'playing') }}"
    timeout: {seconds: 15}
  - wait_template: "{{ not is_state(cast_player, 'playing') }}"
    timeout: {seconds: "{{ max_seconds | int(60) }}"}
  - delay: {seconds: 1}
  - action: scene.turn_on
    # Restoring "playing" presses play; if that fails, power, input and volume still came back.
    continue_on_error: true
    target:
      entity_id: scene.hegel_connect_before_announcement
  - if:
      - condition: template
        value_template: "{{ was_playing }}"
    then:
      # Spotify can carry on by itself; otherwise the player stays on Cast's receiver until play.
      - wait_template: >-
          {{ is_state(amplifier, 'playing')
             and 'Default Media Receiver' not in (state_attr(amplifier, 'service') or '') }}
        timeout: {seconds: 5}
      - if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          - action: media_player.media_play
            continue_on_error: true
            target:
              entity_id: !input amplifier
